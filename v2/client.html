<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Укажите ваши данные · Просебя</title>
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/app.css?v=14">
</head>
<body data-layout="client" data-active="">
  <main class="main-wrap main-wrap--flex">
    <a class="back" id="back" href="specialist.html"><span data-icon="back"></span>Назад</a>
    <section class="panel">
      <div class="panel__head" id="head"></div>
      <form class="panel__body" id="form" novalidate>
        <div class="panel__fields">
          <div class="field" data-field="first"><div class="field__box"><div class="field__body"><label class="field__label" for="first">Имя</label><input class="field__input" id="first" name="first" autocomplete="given-name" placeholder="Имя"></div></div><div class="field__helper"></div></div>
          <div class="field" data-field="last"><div class="field__box"><div class="field__body"><label class="field__label" for="last">Фамилия</label><input class="field__input" id="last" name="last" autocomplete="family-name" placeholder="Фамилия"></div></div><div class="field__helper"></div></div>
          <div class="field" data-field="promo"><div class="field__box"><div class="field__body"><label class="field__label" for="promo">Промокод</label><input class="field__input" id="promo" name="promo" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Промокод"></div></div><div class="field__helper"></div></div>
        </div>
        <button class="btn btn--primary btn--l" type="submit" id="next">Далее</button>
      </form>
    </section>
  </main>
  <script src="assets/app.js?v=10"></script>
  <script>
    (function () {
      document.querySelector("[data-icon=back]").outerHTML = ICONS.back;
      var spec = qs("spec") || "psychologist", id = qs("id") || "2", day = qs("day") || "1", time = qs("time") || "11:30";
      /* Экран нужен только клиенту без единой записи. Остальным — сразу проверка; ?template=1 открывает макет в любом случае (для индекса) */
      if (!qs("template") && !PS.isNewClient()) { location.replace("confirm.html" + location.search); return; }
      document.getElementById("back").href = "specialist.html?spec=" + spec + "&id=" + id;
      document.getElementById("head").innerHTML = PS.stepper(4, 5, "Ваши данные") + '<h1 class="panel__title">Укажите ваши данные</h1>';

      /* персональные данные не подставляются: пользователь вводит их сам, «Далее» недоступна, пока всё не заполнено */
      var rules = {
        first: { test: function (v) { return v.trim().length > 0; }, msg: "Укажите имя" },
        last: { test: function (v) { return v.trim().length > 0; }, msg: "Укажите фамилию" },
        promo: { test: function (v) { return v.trim().length > 0; }, msg: "Укажите промокод" }   /* обязателен; на сервере проверяется отдельно */
      };
      var INVALID = "Промокод не найден";   /* промокод может быть не уникальным, поэтому «уже использован» не пишем */
      var next = document.getElementById("next"), fields = {};
      Object.keys(rules).forEach(function (k) { fields[k] = document.querySelector('[data-field="' + k + '"]'); });
      function valid(k) { return rules[k].test(fields[k].querySelector("input").value); }
      var rejected = "";   /* промокод, который «сервер» уже отклонил: ошибка остаётся, пока значение не изменят */
      function show(k) {
        var v = fields[k].querySelector("input").value;
        setFieldError(fields[k], !valid(k) ? rules[k].msg : (k === "promo" && v === rejected ? INVALID : ""));
      }
      function refresh() { var ok = Object.keys(rules).every(valid); next.disabled = !ok; next.classList.toggle("is-disabled", !ok); }
      Object.keys(rules).forEach(function (k) {
        var input = fields[k].querySelector("input");
        input.addEventListener("blur", function () { show(k); refresh(); });
        input.addEventListener("input", function () { if (fields[k].classList.contains("is-error")) show(k); refresh(); });
      });
      /* ?state=invalid — введён неверный промокод */
      /* ?state=errors — как на макете: пользователь ввёл имя и фамилию, промокод оставил пустым */
      if (qs("state") === "errors") {
        fields.first.querySelector("input").value = "София";
        fields.last.querySelector("input").value = "Сергеева";
                show("promo");
      }
      refresh();
      /* ?state=invalid — имя и фамилия введены, промокод неверный */
      if (qs("state") === "invalid") {
        fields.first.querySelector("input").value = "София";
        fields.last.querySelector("input").value = "Сергеева";
        fields.promo.querySelector("input").value = "SPRING2026";
        rejected = "SPRING2026"; show("promo");
        refresh();
      }
      document.getElementById("form").addEventListener("submit", function (e) {
        e.preventDefault();
        Object.keys(rules).forEach(show);
        if (!Object.keys(rules).every(valid)) return;   /* промокод пустой — записаться нельзя */
        var input = fields.promo.querySelector("input");
        next.disabled = true; next.textContent = "Проверяем…";
        setTimeout(function () {   /* «сервер» проверяет промокод */
          next.textContent = "Далее";
          if (!PS.checkPromo(input.value)) { rejected = input.value; next.disabled = false; show("promo"); input.focus(); return; }
          PS.setPromoOk();
          location.href = "confirm.html?spec=" + spec + "&id=" + id + "&day=" + day + "&time=" + encodeURIComponent(time);
        }, 600);
      });
    })();
  </script>
</body>
</html>
