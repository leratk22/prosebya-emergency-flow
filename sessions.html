<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои сессии · Просебя</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body data-layout="app" data-active="sessions">
  <main class="main-wrap">
    <h1 class="title-xl page-title">Мои сессии</h1>
    <div class="list" id="list"></div>
  </main>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      /* ближайшие сессии клиента; последняя отменена — без стрелки, с плашкой «Отменена» */
      var sessions = [
        { id: 2, label: "Сегодня 19:30", day: 0, time: "19:30" },
        { id: 4, label: "Завтра 10:00", day: 1, time: "10:00" },
        { id: 7, label: "11 октября 09:30", day: 2, time: "09:30" },
        { id: 9, label: "13 октября 12:00", day: 4, time: "12:00", cancelled: true }
      ];
      document.getElementById("list").innerHTML = sessions.map(function (x) {
        var s = SPECIALISTS.filter(function (y) { return y.id === x.id; })[0];
        var text = '<div class="list__row-text"><div class="list__row-title">' + s.name + '</div><div class="list__row-sub">' + x.label + "</div></div>";
        if (x.cancelled) return '<div class="list__row">' + text + '<span class="list__row-aside"><span class="badge">Отменена</span></span></div>';
        return '<a class="list__row" href="session.html?id=' + x.id + "&day=" + x.day + "&time=" + encodeURIComponent(x.time) + '">' + text +
          '<span class="list__row-aside">' + ICONS.chevron + "</span></a>";
      }).join("");
    })();
  </script>
</body>
</html>
