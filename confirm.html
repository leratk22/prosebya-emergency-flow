<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подтверждение записи · Просебя</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body data-layout="app" data-active="">
  <main class="main-wrap">
    <a class="back" href="javascript:history.back()"><span data-icon="back"></span>Назад</a>
    <section class="card card--summary">
      <div class="summary">
        <div class="summary__title">Подтверждение записи</div>
        <div class="summary__body"><h1 class="title-l" id="name"></h1></div>
        <div class="facts">
          <div class="facts__item"><span class="facts__label">Дата</span><span class="facts__value" id="date"></span></div>
          <div class="facts__divider"></div>
          <div class="facts__item"><span class="facts__label">Время</span><span class="facts__value" id="time"></span></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn--primary btn--l" type="button" id="submit">Записаться</button>
        <label class="checkbox" style="padding:0">
          <input class="checkbox__input" type="checkbox" id="consent" checked>
          <span class="checkbox__box"></span>
          <span class="checkbox__label">Я даю согласие на обработку персональных данных</span>
        </label>
      </div>
    </section>
  </main>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      document.querySelector("[data-icon=back]").outerHTML = ICONS.back;
      document.querySelector(".checkbox__box").innerHTML = ICONS.check;
      var id = +qs("id") || 2;
      var s = SPECIALISTS.filter(function (x) { return x.id === id; })[0] || SPECIALISTS[1];
      var day = qs("day") !== null ? +qs("day") : s.day;
      var time = qs("time") || s.time;
      document.getElementById("name").textContent = s.name;
      document.getElementById("date").textContent = day === 0 ? "Сегодня" : day === 1 ? "Завтра" : PS.dateLabel(PS.addDays(PS.TODAY, day));
      document.getElementById("time").textContent = time;

      var consent = document.getElementById("consent"), btn = document.getElementById("submit");
      function refresh() { btn.disabled = !consent.checked; }
      consent.addEventListener("change", refresh);
      refresh();
      btn.addEventListener("click", function () {
        if (btn.disabled) return;
        location.href = "session.html?id=" + s.id + "&day=" + day + "&time=" + encodeURIComponent(time);
      });
      if (qs("state") === "unchecked") { consent.checked = false; refresh(); }
    })();
  </script>
</body>
</html>
