<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Перенос записи · Просебя</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body data-layout="client" data-active="sessions">
  <main class="main-wrap main-wrap--flex">
    <a class="back" href="sessions.html"><span data-icon="back"></span>Назад</a>
    <section class="panel">
      <div class="panel__head" id="head"></div>
      <div class="panel__body" id="body"></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      document.querySelector("[data-icon=back]").outerHTML = ICONS.back;
      var rec = PS.records().filter(function (r) { return r.id === +qs("id"); })[0];
      if (!rec || !PS.canChange(rec)) { location.replace("sessions.html"); return; }   /* менее 6 часов до начала */
      document.getElementById("head").innerHTML = PS.stepper(1, 2, "Дата и время") +
        '<h1 class="panel__title">Перенос записи</h1><p class="panel__sub">Выберите новое время — специалист остаётся тот же</p>';
      var body = document.getElementById("body");
      body.innerHTML = '<div id="dt"></div>';   /* текущее время показываем на следующем экране («Было → Станет») */
      PS.mountDateTime(document.getElementById("dt"), { onPick: function (day, time) {
        location.href = "reschedule-confirm.html?id=" + rec.id + "&day=" + day + "&time=" + encodeURIComponent(time);
      } });
    })();
  </script>
</body>
</html>
