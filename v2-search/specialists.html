<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Выберите специалиста · Просебя</title>
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/app.css?v=19">
</head>
<body data-layout="client" data-active="">
  <main class="main-wrap main-wrap--flex">
    <a class="back" href="specialties.html"><span data-icon="back"></span>Назад</a>
    <section class="panel">
      <div class="panel__head" id="head"></div>
      <div class="psearch" id="search">
        <label class="psearch__box">
          <svg class="psearch__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.75"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
          <input class="psearch__input" id="q" type="search" placeholder="Поиск специалиста" aria-label="Поиск специалиста" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
          <button class="psearch__clear" id="q-clear" type="button" aria-label="Очистить поиск" hidden><svg viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </label>
      </div>
      <div class="prows" id="list" aria-live="polite"></div>
      <div class="panel__empty panel__empty--flow search-empty" id="search-empty" hidden><img class="panel__ill" src="assets/illustration-search-empty.png" alt=""><h2 class="panel__title">Мы никого не нашли по вашему запросу</h2></div>
    </section>
  </main>
  <script src="assets/app.js?v=12"></script>
  <script>
    (function () {
      document.querySelector("[data-icon=back]").outerHTML = ICONS.back;
      var spec = qs("spec") || "psychologist";
      var title = (SPECIALTIES.filter(function (s) { return s.id === spec; })[0] || SPECIALTIES[1]).title;
      document.getElementById("head").innerHTML = PS.stepper(2, PS.flowSteps(), "Специалист") + '<h1 class="panel__title">' + title + "</h1>";
      var list = document.getElementById("list");
      var state = qs("state");   /* ?state=loading, ?state=error, ?state=none */
      if (state === "error") { location.replace("error.html"); return; }
      if (state === "none") {   /* нет свободного времени ни у одного специалиста */
        document.getElementById("search").hidden = true;
        list.outerHTML = '<div class="panel__empty panel__empty--flow"><img class="panel__ill" src="assets/illustration-time.png" alt="">' +
          '<h2 class="panel__title">Свободных мест нет</h2>' +
          '<p class="panel__sub">Сейчас ни у одного специалиста нет свободного времени. Загляните позже или выберите другую специальность.</p>' +
          '<a class="btn btn--primary btn--l" href="specialties.html">Выбрать другую специальность</a></div>';
        return;
      }
      if (state === "loading") {   /* скелетон при заходе на экран: заголовок и строки списка, поиск виден */
        document.getElementById("q").disabled = true;
        document.querySelector("#head .panel__title").outerHTML = '<div class="skeleton" style="width:140px;height:32px;border-radius:8px"></div>';
        for (var i = 0; i < 4; i++) list.insertAdjacentHTML("beforeend", '<div class="prow prow--skeleton"><div class="skeleton" style="width:56px;height:56px;border-radius:50%;flex-shrink:0"></div><div class="prow__text"><div class="skeleton" style="width:55%;height:20px"></div><div class="skeleton" style="width:35%;height:16px"></div></div></div>');
        return;
      }

      /* Поиск по списку специалистов — как в календаре специалиста: по любой части ФИО, от первой же буквы, результат обновляется сразу по мере ввода
         (без кнопки «Найти», без порога по длине, без задержки). Слова запроса — любые подстроки полного ФИО, в любом порядке; регистр и «ё/е» не важны.
         ?q=... — открыть сразу с запросом (для просмотра состояний) */
      var q = document.getElementById("q"), clear = document.getElementById("q-clear"), empty = document.getElementById("search-empty");
      function norm(t) { return String(t).toLowerCase().replace(/ё/g, "е"); }
      function rowsHtml(items) {
        return items.map(function (s) {
          return '<a class="prow" href="specialist.html?spec=' + spec + "&id=" + s.id + '">' + PS.photo(s.id, 56) +
            '<div class="prow__text"><div class="prow__title">' + s.name + '</div><div class="prow__sub">' + whenLabel(s) + "</div></div>" + ICONS.chevron + "</a>";
        }).join("");
      }
      function matches(query) {
        var words = norm(query).split(/\s+/).filter(Boolean);
        return SPECIALISTS.filter(function (s) { var n = norm(s.name); return words.every(function (w) { return n.indexOf(w) !== -1; }); });
      }
      function render() {
        clear.hidden = !q.value;
        var found = matches(q.value);   /* пустой запрос — все специалисты */
        list.innerHTML = rowsHtml(found);
        list.hidden = !found.length; empty.hidden = !!found.length;
      }
      q.addEventListener("input", render);
      q.addEventListener("keydown", function (e) { if (e.key === "Escape" && q.value) { q.value = ""; render(); } });
      clear.addEventListener("click", function () { q.value = ""; render(); q.focus(); });
      if (qs("q")) q.value = qs("q");
      render();
    })();
  </script>
</body>
</html>
