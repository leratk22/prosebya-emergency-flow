<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запись перенесена · Просебя</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body data-layout="client" data-active="sessions">
  <main class="main-wrap main-wrap--flex" style="padding-top:8px">
    <section class="panel panel--tall">
      <div class="panel__body panel__body--grow" style="padding-top:40px;padding-bottom:16px">
        <img class="panel__ill" src="assets/illustration-session.png" alt="">
        <div class="panel__center" style="max-width:440px;align-self:center">
          <h1 class="panel__title">Запись перенесена</h1>
          <p class="panel__sub" id="text"></p>
        </div>
        <div class="panel__actions">
          <a class="btn btn--primary btn--l" id="gcal" target="_blank" rel="noopener" href="#">Добавить в Google Календарь</a>
          <a class="btn btn--secondary btn--l" href="sessions.html">Перейти к моей записи</a>
        </div>
      </div>
    </section>
  </main>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      var rec = PS.records().filter(function (r) { return r.id === +qs("id"); })[0] || { day: 1, time: "11:30", specialist: 2 };
      var s = PS.specialistById(rec.specialist);
      document.getElementById("text").textContent = "Новое время — " + PS.dateLabel(PS.addDays(PS.TODAY, rec.day)) + " в " + rec.time +
        ". Старая запись удалена, письмо с новой датой отправлено на почту.";
      document.getElementById("gcal").href = PS.gcalUrl(rec.day, rec.time, s.name);
    })();
  </script>
</body>
</html>
