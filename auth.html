<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход или регистрация · Просебя</title>
  <link rel="stylesheet" href="assets/app.css?v=2">
</head>
<body data-layout="guest">
  <main class="main-wrap">
    <section class="card card--center">
      <div class="card__head">
        <h1 class="title-xl">Войдите или зарегистрируйтесь</h1>
        <p class="text-l">Данные храним в зашифрованном виде и никому не передаем</p>
      </div>
      <form class="controls" id="auth-form" novalidate>
        <div class="field field--phone" id="phone-field">
          <div class="field__box">
            <div class="field__body">
              <label class="field__label" for="phone">Телефон</label>
              <div class="field__row">
                <span class="field__prefix">+7</span>
                <input class="field__input" id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="Введите телефон" maxlength="15">
              </div>
            </div>
          </div>
          <div class="field__helper"></div>
        </div>
        <button class="btn btn--primary btn--l" type="submit" id="submit" disabled>Получить код по СМС</button>
      </form>
    </section>
  </main>
  <script src="assets/app.js?v=2"></script>
  <script>
    (function () {
      var input = document.getElementById("phone");
      var field = document.getElementById("phone-field");
      var btn = document.getElementById("submit");
      var form = document.getElementById("auth-form");

      function digits() { return input.value.replace(/\D/g, "").slice(0, 10); }
      function format(d) {
        var out = "";
        if (d.length > 0) out += "(" + d.slice(0, 3);
        if (d.length >= 3) out += ") ";
        if (d.length > 3) out += d.slice(3, 6);
        if (d.length > 6) out += "-" + d.slice(6, 8);
        if (d.length > 8) out += "-" + d.slice(8, 10);
        return out;
      }
      input.addEventListener("input", function () {
        var d = digits();
        input.value = format(d);
        btn.disabled = d.length < 10;
        setFieldError(field, "");
      });
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var d = digits();
        if (d.length < 10) { setFieldError(field, "Введите корректный номер телефона"); return; }
        location.href = "sms.html?phone=" + d;
      });
      /* состояние ошибки: auth.html?state=error */
      if (qs("state") === "error") { input.value = format("98545"); setFieldError(field, "Введите корректный номер телефона"); }
    })();
  </script>
</body>
</html>
