<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Все специалисты · Просебя</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body data-layout="app" data-active="">
  <main class="main-wrap">
    <h1 class="title-xl page-title">Все специалисты</h1>
    <div class="list" id="list"></div>
  </main>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      var list = document.getElementById("list");
      var state = qs("state");   /* ?state=loading — скелетон, ?state=error — 500 */
      if (state === "error") { location.replace("error.html"); return; }
      if (state === "loading") {
        for (var i = 0; i < 6; i++) {
          list.insertAdjacentHTML("beforeend", '<div class="list__row"><div class="list__row-text"><div class="skeleton" style="width:55%;height:20px"></div><div class="skeleton" style="width:90%;height:20px"></div></div></div>');
        }
        return;
      }
      list.innerHTML = SPECIALTIES.map(function (s) {
        return '<a class="list__row" href="specialists.html?spec=' + s.id + '">' +
          '<div class="list__row-text"><div class="list__row-title">' + s.title + '</div><div class="list__row-sub">' + s.desc + "</div></div>" +
          '<span class="list__row-aside">' + ICONS.chevron + "</span></a>";
      }).join("");
    })();
  </script>
</body>
</html>
