<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Загрузка · Просебя</title>
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/app.css?v=2">
</head>
<body data-layout="guest">
  <main class="main-wrap">
    <div class="loader" role="status" aria-label="Загрузка"><div class="spinner"></div></div>
  </main>
  <script src="assets/app.js?v=2"></script>
  <script>
    /* loading.html?next=client.html — спиннер на экране, затем переход; без next остаётся лоадером */
    var next = qs("next");
    if (next && /^[a-z-]+\.html(\?.*)?$/.test(next)) setTimeout(function () { location.href = next; }, 1200);
  </script>
</body>
</html>
